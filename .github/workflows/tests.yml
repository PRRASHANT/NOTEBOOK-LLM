name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install numpy pypdf faiss-cpu
      - name: Verify native FAISS import
        run: python -c "import faiss; print(faiss.__version__)"
      - name: Run unit and native FAISS integration tests
        run: python -m unittest discover -s tests -v
